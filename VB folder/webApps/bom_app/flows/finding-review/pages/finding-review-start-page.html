<div class="p-6 md:p-8 space-y-6 bg-[#f8fafc] text-base text-slate-800 min-h-screen font-sans w-full">
  
  <section>
    <h2 class="text-3xl font-black mb-1 text-slate-900">Finding Review Workflow</h2>
    <p class="text-slate-600 font-medium mb-6 text-base">Human-in-the-loop status transition desk. Deterministic evidence is separated clearly from Advisory AI layers.</p>
    
    <div class="space-y-6">
      <!-- Filter Bar -->
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 flex gap-3 flex-wrap">
        <select class="px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-sm font-bold text-slate-800 shadow-sm focus:outline-none"><option>All Statuses</option><option>OPEN</option><option>REVIEWED</option><option>IGNORED</option></select>
        <select class="px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-sm font-bold text-slate-800 shadow-sm focus:outline-none"><option>All Severities</option><option>CRITICAL</option><option>HIGH</option><option>WARNING</option><option>INFO</option></select>
        <button class="px-4 py-2 rounded-xl border border-slate-200 bg-white font-bold text-sm text-slate-700 hover:bg-slate-50 transition-all shadow-sm">Clear Filters</button>
      </div>

      <div class="grid xl:grid-cols-3 gap-6 items-start">
        
        <!-- Left Column: DYNAMIC Finding Cards List -->
        <div class="xl:col-span-2 space-y-4">
          <oj-bind-for-each data="[[ $variables.findingsSdp ]]">
            <template>
              
              <!-- Card with Dynamic Click Handler and Dynamic Highlight Ring -->
              <div on-click="[[ $listeners.clickFinding ]]" :data-finding-id="[[ $current.data.finding_id ]]" :class="[[ 'w-full text-left bg-white p-5 rounded-2xl transition-all border shadow-sm cursor-pointer ' + (String($variables.selectedFindingId) === String($current.data.finding_id) ? 'ring-2 ring-slate-900 border-transparent shadow-md' : 'border-slate-200 hover:shadow-md hover:border-slate-300') ]]">
                <div class="flex justify-between gap-4">
                  <div>
                    <div class="flex items-center gap-3 mb-2">
                      <b class="text-xl text-slate-900 font-black"><oj-bind-text value="[[ $current.data.item_number ]]"></oj-bind-text></b>
                      <span class="inline-flex items-center rounded-full shadow-sm text-[10px] font-bold px-2.5 py-1 border border-slate-200 bg-white text-slate-700"><oj-bind-text value="[[ $current.data.rule_name ]]"></oj-bind-text></span>
                    </div>
                    <div class="text-[10px] font-bold text-slate-500 bg-slate-100 inline-block px-2 py-1 rounded border border-slate-200"><oj-bind-text value="[[ $current.data.rule_code + ' · Finding #' + $current.data.finding_id ]]"></oj-bind-text></div>
                  </div>
                  <div class="flex flex-col gap-2 items-end">
                    <span :class="[[ 'inline-flex items-center rounded-full shadow-sm text-[10px] font-bold px-2.5 py-1 uppercase tracking-widest border ' + ($current.data.severity === 'CRITICAL' ? 'bg-rose-100 text-rose-800 border-rose-200' : ($current.data.severity === 'HIGH' ? 'bg-orange-100 text-orange-800 border-orange-200' : ($current.data.severity === 'WARNING' ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-slate-100 text-slate-800 border-slate-200'))) ]]">
                      <oj-bind-text value="[[ $current.data.severity ]]"></oj-bind-text>
                    </span>
                    <span :class="[[ 'inline-flex items-center rounded-full shadow-sm text-[10px] font-bold px-2.5 py-1 uppercase tracking-widest border ' + ($current.data.issue_status === 'OPEN' ? 'bg-amber-100 text-amber-800 border-amber-200' : ($current.data.issue_status === 'REVIEWED' ? 'bg-sky-100 text-sky-800 border-sky-200' : 'bg-slate-200 text-slate-700 border-slate-300')) ]]">
                      <oj-bind-text value="[[ $current.data.issue_status ]]"></oj-bind-text>
                    </span>
                  </div>
                </div>
                <div class="text-sm text-slate-800 font-medium mt-4 bg-slate-50 p-3 rounded-lg border border-slate-200 shadow-inner flex items-center gap-3">
                  <span class="bg-white px-2 py-1 rounded border border-slate-200 shadow-sm font-bold break-all"><oj-bind-text value="[[ $current.data.actual_value || 'NULL' ]]"></oj-bind-text></span> 
                  <span class="text-slate-400 font-black">→</span> 
                  <span class="text-slate-500 text-xs">expected</span> 
                  <span class="bg-white px-2 py-1 rounded border border-slate-200 shadow-sm font-bold break-all"><oj-bind-text value="[[ $current.data.expected_value || '—' ]]"></oj-bind-text></span>
                </div>
              </div>
            </template>
          </oj-bind-for-each>
        </div>
        
        <!-- Right Column: Review Sidebar -->
        <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-200 h-fit sticky top-24">
          
          <!-- Default State (Shows when no card is clicked yet) -->
          <oj-bind-if test="[[ !$variables.selectedFindingId ]]">
            <div class="text-center py-12">
              <svg class="w-12 h-12 text-slate-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
              <h3 class="text-lg font-black text-slate-900 mb-1">No Finding Selected</h3>
              <p class="text-sm text-slate-500 font-medium">Click on any finding card from the list to review its details, evidence, and update its status.</p>
            </div>
          </oj-bind-if>
          
          <!-- DYNAMIC Selected State -->
          <oj-bind-if test="[[ $variables.selectedFindingId ]]">
            <oj-bind-for-each data="[[ $variables.findingsSdp ]]">
              <template>
                <oj-bind-if test="[[ String($current.data.finding_id) === String($variables.selectedFindingId) ]]">
                  
                  <div class="text-[10px] uppercase font-black text-slate-400 tracking-widest mb-1">Selected Review Item</div>
                  <h3 class="font-black text-2xl text-slate-900"><oj-bind-text value="[[ $current.data.item_number ]]"></oj-bind-text></h3>
                  
                  <div class="mt-3 flex gap-2">
                    <span class="inline-flex items-center rounded-full shadow-sm text-[10px] font-bold px-2.5 py-1 bg-slate-100 border border-slate-200 text-slate-700"><oj-bind-text value="[[ $current.data.rule_name ]]"></oj-bind-text></span>
                    <span :class="[[ 'inline-flex items-center rounded-full shadow-sm text-[10px] font-bold px-2.5 py-1 uppercase tracking-widest border border-transparent ' + ($current.data.severity === 'CRITICAL' ? 'bg-rose-100 text-rose-800' : ($current.data.severity === 'HIGH' ? 'bg-orange-100 text-orange-800' : ($current.data.severity === 'WARNING' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700'))) ]]">
                      <oj-bind-text value="[[ $current.data.severity ]]"></oj-bind-text>
                    </span>
                    <span :class="[[ 'inline-flex items-center rounded-full shadow-sm text-[10px] font-bold px-2.5 py-1 uppercase tracking-widest border border-transparent ' + ($current.data.issue_status === 'OPEN' ? 'bg-amber-100 text-amber-800' : ($current.data.issue_status === 'REVIEWED' ? 'bg-sky-100 text-sky-800' : 'bg-slate-200 text-slate-700')) ]]">
                      <oj-bind-text value="[[ $current.data.issue_status ]]"></oj-bind-text>
                    </span>
                  </div>

                  <!-- Finding Location & Evidence -->
                  <div class="border-t border-slate-100 mt-5 pt-5">
                     <h4 class="font-black text-lg text-slate-900 mb-3 tracking-tight">Finding Location & Details</h4>
                     
                     <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 shadow-sm mb-5 flex flex-wrap items-center gap-2 text-sm">
                        <span class="font-bold text-slate-500 uppercase text-[10px] tracking-wider mr-2">Assembly:</span>
                        <span class="bg-white px-2.5 py-1 rounded border border-slate-200 shadow-sm font-bold text-slate-800"><oj-bind-text value="[[ $current.data.item_number ]]"></oj-bind-text></span>
                     </div>

                     <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                            <span class="text-[10px] uppercase text-slate-500 font-black tracking-wider block mb-1">Observed Value</span>
                            <span class="font-bold text-slate-900 break-words text-sm"><oj-bind-text value="[[ $current.data.actual_value || 'NULL' ]]"></oj-bind-text></span>
                        </div>
                        <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                            <span class="text-[10px] uppercase text-slate-500 font-black tracking-wider block mb-1">Expected Condition</span>
                            <span class="font-bold text-slate-900 break-words text-sm"><oj-bind-text value="[[ $current.data.expected_value || '—' ]]"></oj-bind-text></span>
                        </div>
                     </div>

                     <p class="text-xs mt-4 text-slate-600 font-medium bg-slate-50 p-3 rounded-lg border border-slate-200 shadow-sm flex gap-2 items-start">
                       <svg class="w-4 h-4 flex-shrink-0 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                       <span><b class="text-slate-900 font-bold">Review Aid:</b> This validation finding requires human review and is meant as an advisory tool, not direct proof the relationship is technically wrong.</span>
                     </p>
                  </div>

                  <!-- AI Explanation Block -->
                  <div class="border-t border-slate-100 mt-6 pt-5">
                    <h4 class="font-black text-lg text-slate-900 mb-3 tracking-tight">AI Explanation & Mitigation</h4>
                    <div class="rounded-xl bg-violet-50 border border-violet-100 p-5 text-sm text-slate-800 shadow-sm leading-relaxed relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-3 opacity-10 pointer-events-none">
                          <svg class="w-16 h-16 text-violet-900" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        </div>
                        <div class="flex justify-between items-start mb-4 relative z-10">
                        <span class="inline-flex items-center rounded-full bg-violet-600 text-white shadow-md px-3 py-1 text-[10px] uppercase tracking-widest font-black">Advisory AI</span>
                            <span class="text-[10px] font-bold text-violet-900 bg-violet-200 px-2.5 py-1 rounded-full border border-violet-300">Status: <oj-bind-text value="[[ $variables.advisoryStatus ]]"></oj-bind-text></span>
                        </div>
                        <p class="mb-3 relative z-10"><b class="text-violet-900 block mb-1 font-black uppercase text-[10px] tracking-wider">Business Context</b> <oj-bind-text value="[[ $variables.advisoryText || '—' ]]"></oj-bind-text></p>
                        <p class="relative z-10"><b class="text-violet-900 block mb-1 font-black uppercase text-[10px] tracking-wider">Suggested Mitigation Action</b> <span class="bg-white px-2 py-1.5 rounded border border-violet-200 inline-block font-medium shadow-sm"><oj-bind-text value="[[ $variables.advisoryMitigation || '—' ]]"></oj-bind-text></span></p>
                    </div>
                    <button on-click="[[ $listeners.clickRequestAdvisory ]]" class="mt-4 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 font-bold text-slate-800 hover:bg-slate-50 hover:border-slate-300 transition-all shadow-sm text-sm flex justify-center items-center gap-2">
                      ↻ Generate or Refresh AI Insights
                    </button>
                  </div>

                  <!-- Update Status Block -->
                  <div class="border-t border-slate-200 mt-6 pt-5 bg-slate-50 -mx-6 -mb-6 p-6 rounded-b-2xl shadow-inner">
                    <b class="text-slate-900 font-black text-lg block mb-3">Update Finding Status</b>
                    <select value="[[ $variables.newStatus ]]" on-value-changed="[[ function(e){ $variables.newStatus = e.detail.value; } ]]" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 bg-white text-sm font-bold text-slate-800 shadow-sm cursor-pointer focus:ring-2 focus:ring-slate-900 focus:outline-none">
                        <option value="OPEN">OPEN</option>
                        <option value="REVIEWED">REVIEWED</option>
                        <option value="IGNORED">IGNORED</option>
                    </select>
                    <textarea value="[[ $variables.statusComment ]]" on-value-changed="[[ function(e){ $variables.statusComment = e.detail.value; } ]]" class="mt-3 w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none shadow-sm font-medium" rows="2" placeholder="Required comment if changing status to 'Ignored'..."></textarea>
                    <button on-click="[[ $listeners.clickSaveStatus ]]" :disabled="[[ $variables.isSavingStatus ]]" class="mt-3 w-full rounded-xl bg-slate-900 text-white px-4 py-3 font-black hover:bg-slate-800 transition-colors shadow-md text-base tracking-wide">
                      <oj-bind-if test="[[ $variables.isSavingStatus ]]">Saving…</oj-bind-if>
                      <oj-bind-if test="[[ !$variables.isSavingStatus ]]">Save Status Change</oj-bind-if>
                    </button>
                  </div>

                </oj-bind-if>
              </template>
            </oj-bind-for-each>
          </oj-bind-if>

        </div>
      </div>
    </div>
  </section>
</div>
